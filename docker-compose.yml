services:

  nginx:
    image: nginx:alpine
    container_name: docker-nginx
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network

  app:
    build:
      context: .
    container_name: docker-app
    working_dir: /app
    command: node app.js
    volumes:
      - ./app.js:/app/app.js:ro
      - ./index.html:/app/index.html:ro
    depends_on:
      - db
      - redis
    networks:
      - app-network

  db:
    image: mariadb:11
    container_name: docker-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: appdb
      MARIADB_USER: appuser
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network




  redis:
    image: redis:alpine
    container_name: docker-redis
    networks:
      - app-network

  adminer:
    image: adminer:latest
    container_name: docker-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - app-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: docker-dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network


networks:

  app-network:
    driver: bridge


volumes:

  db-data:
